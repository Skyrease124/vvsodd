<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PricePocket AI | PricePocketPro</title>
<meta name="theme-color" content="#070d1c">
<link rel="stylesheet" href="../styles.css">
</head>
<body class="aibody">
<header class="nav">
  <div class="wrap nav-in">
    <a class="logo" href="../"><span class="mark">P</span>ricePocketAsset</a>
    <nav><a href="../#map">Home</a><a href="../account/">Account</a></nav>
  </div>
</header>
<main class="aipage">
  <p id="gate" class="notice" hidden></p>
  <div id="app" hidden>
    <div class="aistage">
      <div class="aitag">PricePocket AI</div>
      <button class="aireset" id="aiclear" type="button" hidden>Reset map</button>
      <div id="aimap" class="aimap"></div>
      <div id="aisel" class="aihint">Tap states to focus, or just ask</div>
    </div>
    <form id="aiform" class="aibar" novalidate>
      <input id="aiq" type="text" maxlength="300" autocomplete="off" placeholder="Ask PricePocket AI anything about tax liens…" aria-label="Ask PricePocket AI">
      <button id="aigo" type="submit" aria-label="Ask">Ask</button>
    </form>
    <div id="aichips" class="aichips" aria-label="Examples"></div>
    <div id="chat" class="aichat" aria-live="polite"></div>
    <p class="aifine">Educational only, not advice. Verify with the county. Lien lists: Palm Beach FL, Larimer CO, Pinal AZ.</p>
  </div>
</main>
<script src="../liens/states/states.js"></script>
<script src="../map-data.js"></script>
<script src="../liens/states/lien-summary.js"></script>
<script src="../liens/states/liens-data.js"></script>
<script src="../liens/states/lien-ui.js"></script>
<script src="ai.js"></script>
<script src="/auth-nav.js"></script>
</body>
</html>
