<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research Report | PricePocketAsset</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PricePocket"><meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/img/favicon.png"><link rel="stylesheet" href="/styles.css">
<style>
.rp{max-width:820px;margin:0 auto;padding:24px 16px 64px}.rp h1{font-size:1.5rem;margin:0 0 6px}.rp .disc{font-size:.85rem;opacity:.85;border:1px solid currentColor;border-radius:12px;padding:12px;margin:12px 0 20px}
.rp h2{font-size:1.05rem;margin:24px 0 8px}.rp dl{margin:0;display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:8px 14px;font-size:.92rem}.rp dt{opacity:.72}.rp dd{margin:0;overflow-wrap:anywhere}
.rp .rtag{background:transparent;display:inline-block;font-size:.7rem;padding:1px 8px;border-radius:99px;margin-left:6px;border:1px solid currentColor}.t-verified{color:#15803d}.t-estimate{color:#b45309}.t-missing{color:#b91c1c}.t-todo{color:#1d4ed8}
.rp .note{display:block;font-size:.78rem;opacity:.7}.rp .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
@media(max-width:560px){.rp dl{grid-template-columns:1fr}}
@media print{body{background:#fff!important;color:#000!important}.rp .bar,header,.dnav,footer{display:none!important}.rp dt,.rp .note,.rp .disc{color:#333!important}.rp h2{break-after:avoid}}
</style></head><body>
<main class="rp" id="rp"><p>Loading report…</p></main>
<script>
(function () {
  const Q = new URLSearchParams(location.search), root = document.getElementById('rp');
  const mk = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
  const api = '/.netlify/functions/aireport?county=' + encodeURIComponent(Q.get('county') || '') + '&parcel=' + encodeURIComponent(Q.get('parcel') || '');
  fetch(api, { credentials: 'same-origin' }).then(async r => {
    const d = await r.json().catch(() => ({})); root.textContent = '';
    if (!r.ok) { root.append(mk('h1', '', r.status === 402 ? 'Pro members only' : 'Report unavailable'), mk('p', '', d.error || 'Please try again.')); const a = mk('a', 'btn', r.status === 401 ? 'Sign in' : 'See plans'); a.href = r.status === 401 ? '/login/?next=' + encodeURIComponent(location.pathname + location.search) : '/plans/'; root.appendChild(a); return; }
    const R = d.report; document.title = R.title + ' | PricePocketAsset';
    root.append(mk('h1', '', R.title), mk('p', 'small muted', 'Generated ' + R.generated), mk('p', 'disc', R.disclaimer));
    const bar = mk('div', 'bar'); const pb = mk('button', 'btn', 'Print or save as PDF'); pb.type = 'button'; pb.onclick = () => print();
    const cs = mk('a', 'btn ghost', 'Download CSV'); cs.href = api + '&format=csv'; bar.append(pb, cs); root.appendChild(bar);
    const tags = { verified: 'Verified', estimate: 'Estimate', missing: 'Missing', todo: 'To do' };
    R.sections.forEach(s => { root.appendChild(mk('h2', '', s.title)); const dl = mk('dl'); s.items.forEach(x => { const dt = mk('dt', '', x.label), dd = mk('dd'); if (/^https?:/.test(x.value)) { const a = mk('a', '', x.value); a.href = x.value; a.target = '_blank'; a.rel = 'noopener noreferrer'; dd.appendChild(a); } else dd.appendChild(document.createTextNode(x.value)); const t = mk('span', 'rtag t-' + x.status, tags[x.status] || x.status); dd.appendChild(t); if (x.note) dd.appendChild(mk('span', 'note', x.note)); dl.append(dt, dd); }); root.appendChild(dl); });
  }).catch(() => { root.textContent = 'Could not load the report. Please try again.'; });
})();
</script></body></html>
