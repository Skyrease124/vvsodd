<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sign in | PricePocketAsset</title>
<meta name="theme-color" content="#0b6e4f">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PricePocket">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="/app-shell.css">
</head>
<body class="ppa-auth loginpg">
<header class="app-bar"><a class="app-brand" href="/"><img src="/img/logo-mark.png" alt=""><span>PricePocket<em>Asset</em></span></a><nav class="app-actions" aria-label="Account"><a class="app-outline" href="/login/">Sign In</a><a class="dbtn" href="/account/?mode=up">Sign Up</a></nav></header>
<main>
<section class="wrap section narrow">
  <div class="app-heading"><h1>Welcome back</h1><p>Sign in to your PricePocketAsset account to search properties, manage lists and track opportunities.</p></div>
  <form id="form" class="setupform app-auth-card">
    <label>Email Address <span class="app-field app-field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg><input id="email" placeholder="you@example.com" name="email" type="email" autocomplete="username" required></span></label>
    <label>Password <span class="app-field app-field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="pw" placeholder="Enter your password" name="password" type="password" autocomplete="current-password" required><button type="button" data-toggle-password="pw" aria-label="Show password" aria-pressed="false"></button></span></label>
    <div class="app-auth-options"><label class="app-check"><input id="remember" type="checkbox" checked> Remember me</label><a href="/forgot/">Forgot your password?</a></div>
    <button class="btn" id="go" type="submit">Sign In</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>
  <p class="app-auth-switch">New here? <a href="/account/?mode=up">Create a free account →</a></p>
</section>
</main>
<footer class="app-footer"><div><p><b>PricePocketAsset</b></p><p class="small"><a href="../legal/privacy/">Privacy</a> &middot; <a href="../legal/terms/">Terms</a> &middot; <a href="../legal/billing/">Billing &amp; refunds</a> &middot; <a href="../legal/disclaimer/">Disclaimer</a></p></div></footer>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const API = '/.netlify/functions/account';
  const next = (() => { const n = new URLSearchParams(location.search).get('next') || ''; return /^\/[A-Za-z0-9\/_\-?=&.%]*$/.test(n) && n.indexOf('//') !== 0 ? n : '/account/'; })();
  fetch(API).then(r => r.json()).then(d => { if (d.user) location.replace(next); }).catch(() => {});
  $('form').addEventListener('submit', async e => {
    e.preventDefault(); $('go').disabled = true; $('msg').textContent = 'One moment…';
    try {
      const r = await fetch(API, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({action: 'login', email: $('email').value, password: $('pw').value, remember: $('remember').checked})});
      const d = await r.json();
      if (r.ok) { location.href = next; return; }
      $('msg').textContent = d.error || 'Something went wrong.';
    } catch (err) { $('msg').textContent = 'Could not reach the server. Try again.'; }
    $('go').disabled = false;
  });
})();
</script>
<script src="/auth-fields.js" defer></script>
</body>
</html>
