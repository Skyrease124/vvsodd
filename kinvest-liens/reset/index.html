<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Choose a new password | PricePocketAsset</title>
<meta name="theme-color" content="#0b6e4f">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<header class="nav">
  <div class="wrap nav-in">
    <a class="logo" href="../"><img class="logoimg" src="/img/logo-mark.png" alt="" width="58" height="27">PricePocketAsset</a>
    <nav><a href="../#map">Map</a><a href="../login/">Sign in</a></nav>
  </div>
</header>
<main>
<section class="wrap section narrow">
  <h1>Choose a new password</h1>
  <form id="form" class="setupform" novalidate>
    <label>New password
      <span style="position:relative;display:block"><input id="pw" type="password" autocomplete="new-password" required style="width:100%;box-sizing:border-box;padding-right:56px">
      <button type="button" id="eye" aria-label="Show password" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;padding:8px;line-height:0;color:inherit"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span>
    </label>
    <p class="small muted">At least 8 characters.</p>
    <button class="btn" id="go" type="submit">Save new password</button>
    <p id="msg" class="small" role="status" aria-live="polite"></p>
  </form>
</section>
</main>
<footer><div class="wrap"><p><b>PricePocketAsset</b></p><p class="small"><a href="../legal/privacy/">Privacy</a> &middot; <a href="../legal/terms/">Terms</a> &middot; <a href="../legal/disclaimer/">Disclaimer</a></p></div></footer>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search), email = q.get('email') || '', token = q.get('token') || '';
  if (!email || !token) $('msg').textContent = 'This link is incomplete. Ask for a new reset link.';
  $('eye').addEventListener('click', () => { $('pw').type = $('pw').type === 'password' ? 'text' : 'password'; });
  $('form').addEventListener('submit', async e => {
    e.preventDefault(); $('go').disabled = true; $('msg').textContent = 'One moment\u2026';
    try {
      const r = await fetch('/.netlify/functions/account', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({action: 'reset', email, token, password: $('pw').value})});
      const d = await r.json();
      if (r.ok) { location.href = '/account/'; return; }
      $('msg').textContent = d.error || 'Something went wrong.';
    } catch (err) { $('msg').textContent = 'Could not reach the server. Try again.'; }
    $('go').disabled = false;
  });
})();
</script>
</body>
</html>
