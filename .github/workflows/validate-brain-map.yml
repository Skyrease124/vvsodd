jobs:
  offline-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node kinvest-liens/tests/brain-map-contract.test.mjs
      - run: node kinvest-liens/tests/brain-map-coverage.test.mjs
      - run: node kinvest-liens/tests/brain-map-sequence.test.mjs
      - run: node kinvest-liens/tests/brain-map-county-progress.test.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-map-agent-dry-run.test.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-map-batch-test.mjs
      - run: node kinvest-liens/tests/brain-map-batch-publish.test.mjs
      - run: node kinvest-liens/tests/brain-map-wayne-gis-quota.test.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-map-wayne-run.test.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-map-scheduled.test.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-map-consolidation.test.mjs
