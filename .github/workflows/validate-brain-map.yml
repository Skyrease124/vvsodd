name: Validate Brain-to-Map pipeline
on:
  push:
    branches: [brain-to-map-pipeline, integration/brain-map-452-453-preserve]
    paths:
      - 'kinvest-liens/map/**'
      - 'kinvest-liens/ai/workshop.js'
      - 'kinvest-liens/owner/maptiler/**'
      - 'kinvest-liens/tests/brain-map-*.test.mjs'
      - 'kinvest-liens/tests/brain-reactor-activity.test.mjs'
      - 'kinvest-liens/tests/fixtures/detroit-*.json'
      - 'netlify/functions/brain-map-*.mjs'
      - 'netlify/functions/brain-wayne-scheduled.mjs'
      - 'netlify/functions/owner-brain-*.mjs'
      - 'netlify/lib/brain-auth.mjs'
      - 'netlify/lib/brain-gis-*.mjs'
      - 'netlify/lib/data/florida-gis-registry.json'
      - 'tools/florida-gis/**'
      - 'tools/florida-land/**'
      - 'netlify/lib/brain-florida-land.mjs'
      - 'netlify/lib/data/florida-land-discovery-audit.json'
      - 'tests/test_pro_first_research.mjs'
      - 'kinvest-liens/owner/brain/connectors/**'
      - 'netlify/lib/brain-reconciliation-*.mjs'
      - 'netlify/lib/brain-larimer-address-diagnostic.mjs'
      - 'netlify/lib/brain-county-sequence.mjs'
      - 'netlify/lib/brain-official-verification.mjs'
      - 'scripts/prepare-brain-preview.mjs'
      - 'netlify.toml'
      - 'netlify/functions/owner-map-coverage.mjs'
      - 'netlify/functions/owner-maptiler-preview.mjs'
      - 'netlify/functions/owner-intelligence*.mjs'
      - 'netlify/lib/brain-source-leads.mjs'
      - 'kinvest-liens/owner/pipeline.js'
      - 'kinvest-liens/owner/brain/**'
      - '.github/workflows/validate-brain-map.yml'
  pull_request:
    paths:
      - 'kinvest-liens/map/**'
      - 'kinvest-liens/ai/workshop.js'
      - 'kinvest-liens/owner/maptiler/**'
      - 'kinvest-liens/tests/brain-map-*.test.mjs'
      - 'kinvest-liens/tests/brain-reactor-activity.test.mjs'
      - 'kinvest-liens/tests/fixtures/detroit-*.json'
      - 'netlify/functions/brain-map-*.mjs'
      - 'netlify/functions/owner-brain-*.mjs'
      - 'netlify/lib/brain-auth.mjs'
      - 'netlify/lib/brain-gis-*.mjs'
      - 'netlify/lib/data/florida-gis-registry.json'
      - 'tools/florida-gis/**'
      - 'tools/florida-land/**'
      - 'netlify/lib/brain-florida-land.mjs'
      - 'netlify/lib/data/florida-land-discovery-audit.json'
      - 'tests/test_pro_first_research.mjs'
      - 'kinvest-liens/owner/brain/connectors/**'
      - 'netlify/lib/brain-reconciliation-*.mjs'
      - 'netlify/lib/brain-larimer-address-diagnostic.mjs'
      - 'netlify/lib/brain-official-verification.mjs'
      - 'scripts/prepare-brain-preview.mjs'
      - 'netlify.toml'
      - 'netlify/functions/owner-map-coverage.mjs'
      - 'netlify/functions/owner-maptiler-preview.mjs'
      - 'netlify/functions/owner-intelligence*.mjs'
      - 'netlify/lib/brain-source-leads.mjs'
      - 'kinvest-liens/owner/pipeline.js'
      - 'kinvest-liens/owner/brain/**'
      - '.github/workflows/validate-brain-map.yml'
jobs:
  offline-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node kinvest-liens/tests/brain-map-contract.test.mjs
      - run: node kinvest-liens/tests/brain-map-coverage.test.mjs
      - run: node kinvest-liens/tests/brain-map-sequence.test.mjs
      - run: node kinvest-liens/tests/brain-map-county-progress.test.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-map-agent-dry-run.test.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-map-batch-test.mjs
      - run: node kinvest-liens/tests/brain-map-batch-publish.test.mjs
      - run: node kinvest-liens/tests/brain-map-wayne-gis-quota.test.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-map-wayne-run.test.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-map-scheduled.test.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-map-consolidation.test.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-reactor-activity.test.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-map-pipeline.test.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-map-preview.test.mjs
      - run: node kinvest-liens/tests/brain-map-requests.test.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-map-autonomous.test.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-map-source-pipeline.test.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-map-maptiler.test.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-map-connectors.test.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-map-reconciliation-research.test.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-map-universal.test.mjs
      - run: python3 tools/florida-gis/build.py --check
      - run: python3 tools/florida-gis/test_build.py
      - run: node kinvest-liens/tests/brain-map-florida-registry.test.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-map-florida-land.test.mjs
      - run: python3 tools/florida-land/test_prepare.py
      - run: node tests/test_pro_first_research.mjs
      - run: node --experimental-vm-modules kinvest-liens/tests/brain-map-putnam-verification.test.mjs
