name: Validate Owner Intelligence Center
on:
  push:
    branches:
      - feature/owner-intelligence-center-20261120
      - claude/engineering-workspace
    paths:
      - 'kinvest-liens/owner/intelligence/**'
      - 'kinvest-liens/owner/dashboard.js'
      - 'netlify/functions/owner-intelligence.mjs'
      - 'netlify/lib/owner-intelligence-sources.mjs'
      - 'tests/owner-intelligence-center.test.mjs'
      - '.github/workflows/validate-owner-intelligence-center.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check netlify/functions/owner-intelligence.mjs
      - run: node --check netlify/lib/owner-intelligence-sources.mjs
      - run: node --test tests/owner-intelligence-center.test.mjs
      - run: node --test tests/owner-certificate-auto-review.test.mjs
      - run: node --test tests/auto-approved-release.test.mjs
      - run: node --test tests/test_all_three_map_modes.mjs
