name: Validate reviewed certificate publication gate
on:
  push:
    branches:
      - claude/engineering-workspace
    paths:
      - scripts/prepare-research-publication.py
      - tests/test_prepare_research_publication.py
      - .github/workflows/prepare-reviewed-certificate-publication.yml
      - .github/workflows/validate-research-publication.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test audited research publication gates
        run: python -m unittest discover -s tests -p 'test_prepare_research_publication.py'
