name: Validate automatic approved research releases
on:
  push:
    branches:
      - feature/auto-publish-approved-research
      - claude/engineering-workspace
    paths:
      - netlify/lib/auto-research-release.mjs
      - netlify/functions/certificate-review.mjs
      - kinvest-liens/owner/certificates/index.html
      - tests/auto-approved-release.test.mjs
      - .github/workflows/validate-auto-approved-releases.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check netlify/lib/auto-research-release.mjs
      - run: node --check netlify/functions/certificate-review.mjs
      - run: node --test tests/auto-approved-release.test.mjs
      - run: node --test tests/test_all_three_map_modes.mjs
