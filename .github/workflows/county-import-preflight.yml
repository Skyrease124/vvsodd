name: County import preflight tests
on:
  pull_request:
    paths:
      - 'netlify/lib/county-import-validation.js'
      - 'scripts/check-county-import.js'
      - 'tests/county-import-validation.test.js'
      - 'scripts/check-existing-parcels.js'
      - 'tests/existing-parcels.test.js'
      - '.github/workflows/county-import-preflight.yml'
      - 'kinvest-liens/liens/states/parcels/**'
      - 'kinvest-liens/map/data/**'
      - 'scripts/check-map-datasets.js'
      - 'tests/map-datasets.test.js'
      - 'scripts/run-county-source-imports.js'
      - 'tests/county-source-imports.test.js'
      - 'county-sources.json'
      - '.github/workflows/county-source-import.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run county import validation tests
        run: node --test tests/county-import-validation.test.js tests/existing-parcels.test.js tests/map-datasets.test.js tests/county-source-imports.test.js
      - name: Check actual county parcel GIS dataset (read only)
        run: node scripts/check-existing-parcels.js kinvest-liens/liens/states/parcels/al-63.json AL
      - name: Check production map dataset sample
        run: node scripts/check-map-datasets.js kinvest-liens/map/data/AL-05.json
      - name: Validate changed map datasets
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --no-tags origin ${{ github.event.pull_request.base.sha }}
          git diff --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }} HEAD -- 'kinvest-liens/map/data/*.json' > /tmp/changed-map-files
          if [ -s /tmp/changed-map-files ]; then
            while IFS= read -r file; do node scripts/check-map-datasets.js "$file" || exit 1; done < /tmp/changed-map-files
          fi
