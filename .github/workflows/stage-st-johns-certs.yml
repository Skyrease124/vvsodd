name: Stage St Johns official unpaid certificate CSV
on:
  push:
    branches:
      - claude/engineering-workspace
    paths:
      - scripts/report-certificate-changes.py
      - tests/test_certificate_change_alerts.py
      - scripts/stage-st-johns-certificates.py
      - scripts/certificate-status.py
      - tests/test_certificate_status.py
      - scripts/compare-certificate-snapshots.py
      - tests/test_certificate_snapshot_changes.py
      - .github/workflows/stage-st-johns-certs.yml
  schedule:
    - cron: '41 10 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test ownership, redemption and tax deed classifications
        run: python -m unittest discover -s tests -p 'test_certificate_status.py'
      - name: Validate official St Johns unpaid certificate CSV
        run: python scripts/stage-st-johns-certificates.py
      - name: Unit-test change alerts
        run: python -m unittest discover -s tests -p 'test_certificate_change_alerts.py'
      - name: Compare with last reviewed snapshot (never infer redemption from disappearance)
        run: |
          python -m unittest discover -s tests -p 'test_certificate_snapshot_changes.py'
          PREVIOUS=/tmp/previous-certificate-snapshot.json
          if git fetch --no-tags origin refs/heads/automation/st-johns-certificate-review:refs/remotes/origin/automation/st-johns-certificate-review; then
            git show origin/automation/st-johns-certificate-review:county-import-staging/fl-st-johns-unpaid-certificates.json > "$PREVIOUS" || rm -f "$PREVIOUS"
          fi
          python scripts/compare-certificate-snapshots.py \
            --current county-import-staging/fl-st-johns-unpaid-certificates.json \
            --previous "$PREVIOUS" \
            --output county-import-staging/fl-st-johns-unpaid-certificates-changes.json
      - name: Summarize changes and warn if manual review needed
        run: |
          python scripts/report-certificate-changes.py \
            --report county-import-staging/fl-st-johns-unpaid-certificates-changes.json \
            --county 'St. Johns'
      - name: Archive review-only staged report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: st-johns-certificate-staging
          path: |
            county-import-staging/fl-st-johns-unpaid-certificates.json
            county-import-staging/fl-st-johns-unpaid-certificates-changes.json
      - name: Push staging review branch
        if: success()
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/st-johns-certificate-review
          title: 'Review St Johns unpaid certificate list update'
          body: 'Official county report. All records remain unverified and not purchasable; source contains county and individual certificates and may include changing statuses.'
          commit-message: 'Stage official St Johns unpaid certificate records'
          add-paths: |
            county-import-staging/fl-st-johns-unpaid-certificates.json
            county-import-staging/fl-st-johns-unpaid-certificates-changes.json
      - name: Link staging branch
        if: always()
        run: |
          echo "Review [St Johns staging branch](https://github.com/${{ github.repository }}/compare/claude/engineering-workspace...automation/st-johns-certificate-review) or the job artifact before publishing." >> "$GITHUB_STEP_SUMMARY"
