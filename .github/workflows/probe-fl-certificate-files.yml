name: Probe Florida county certificate file formats
on:
  workflow_dispatch:
  push:
    branches:
      - claude/engineering-workspace
    paths:
      - 'scripts/probe-county-certificate-files.py'
      - '.github/workflows/probe-fl-certificate-files.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect official county XLSX and ZIP files (no publication)
        run: python scripts/probe-county-certificate-files.py
      - name: Preserve inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: florida-county-source-probe
          path: county-source-probe-report.json
          if-no-files-found: warn
