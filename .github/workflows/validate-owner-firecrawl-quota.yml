name: Validate owner Firecrawl successful-scan quota
on:
  push:
    branches:
      - fix/firecrawl-successful-scan-quota-20261120
      - claude/engineering-workspace
    paths:
      - netlify/functions/owner-intelligence.mjs
      - netlify/lib/owner-firecrawl-quota.mjs
      - kinvest-liens/owner/intelligence/index.html
      - tests/owner-firecrawl-quota-v2.test.mjs
      - tests/owner-intelligence-center.test.mjs
      - tests/owner-firecrawl-standard-retention.test.mjs
      - .github/workflows/validate-owner-firecrawl-quota.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check netlify/functions/owner-intelligence.mjs
      - run: node --test tests/owner-firecrawl-quota-v2.test.mjs
      - run: node --test tests/owner-intelligence-center.test.mjs
      - run: node --test tests/owner-firecrawl-standard-retention.test.mjs
