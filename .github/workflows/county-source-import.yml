name: Scheduled county source import
on:
  push:
    branches:
      - claude/engineering-workspace
    paths:
      - 'county-sources.json'
      - 'scripts/run-county-source-imports.js'
      - '.github/workflows/county-source-import.yml'
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch and validate approved county feeds
        run: node scripts/run-county-source-imports.js county-sources.json
      - name: Stage county updates (PR creation may require repo permission)
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/county-source-staging
          delete-branch: true
          title: 'Review staged county source updates'
          body: 'Automated county data fetch. Review source, validation results, and parcel records before importing into production. This does not publish live records.'
          commit-message: 'Stage validated county source updates'
          add-paths: county-import-staging/
      - name: Report review branch link
        if: always()
        run: |
          echo "### County import staging review" >> "$GITHUB_STEP_SUMMARY"
          echo "Review staged data in [automation/county-source-staging](https://github.com/${{ github.repository }}/compare/claude/engineering-workspace...automation/county-source-staging) before publishing. GitHub Actions may block creating PRs; the staged branch remains available." >> "$GITHUB_STEP_SUMMARY"
