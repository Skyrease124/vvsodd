name: Validate owner AI summary and batch triage
on:
  push:
    branches:
      - fix/ai-review-summary-and-batch-triage-20261120
      - claude/engineering-workspace
    paths:
      - 'netlify/functions/certificate-auto-review.mjs'
      - 'kinvest-liens/owner/certificates/index.html'
      - 'tests/owner-ai-batch-and-summary.test.mjs'
      - '.github/workflows/validate-owner-ai-batch-summary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check netlify/functions/certificate-auto-review.mjs
      - run: node --test tests/owner-ai-batch-and-summary.test.mjs
      - run: node --test tests/owner-certificate-auto-review.test.mjs
      - run: node --test tests/auto-approved-release.test.mjs
      - run: node --test tests/test_all_three_map_modes.mjs
